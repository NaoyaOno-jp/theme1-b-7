<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イキテル</title>

    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>

    <main class="login-container">

        <h1 class="site-title">イキテル</h1>

        <p class="login-message">
            ログインしてください
        </p>

        <form id="loginForm" method="post">

            <label for="email">
                ログインID（メールアドレス）
            </label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                required
            >

            <label for="password">
                パスワード
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" disabled>
                ログイン
            </button>

        </form>

        <p id="errorMessage" role="alert"></p>
        <noscript>ログインにはJavaScriptを有効にしてください。</noscript>

    </main>

</body>
</html>
