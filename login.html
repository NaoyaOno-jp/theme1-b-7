<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イキテル</title>

    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="login.css?v=watched-name-1">
    <script src="login.js?v=watched-name-1" defer></script>
</head>
<body>

    <main class="login-container">

        <h1 class="site-title"><img src="logo.svg" width="40" height="40" alt="">イキテル</h1>
        <p id="authAvailability" class="form-error" role="status"></p>

        <section id="login" aria-label="ログイン">
            <p class="login-message">ログインしてください</p>
            <p id="registrationSuccess" class="form-status" role="status"></p>

            <form id="loginForm" class="auth-form" method="post">
                <label for="email">ログインID（メールアドレス）</label>
                <input type="email" id="email" name="email" autocomplete="username" required>

                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <button type="submit" disabled>ログイン</button>
            </form>

            <p id="errorMessage" class="form-error" role="alert"></p>
            <p class="auth-switch"><a href="#register">新規登録</a></p>
        </section>

        <section id="register" aria-labelledby="registerTitle" hidden>
            <h2 id="registerTitle" class="login-message">新規登録</h2>

            <form id="registerForm" class="auth-form" method="post">
                <label for="registerEmail">メールアドレス</label>
                <input type="email" id="registerEmail" name="email" autocomplete="username" required>

                <label for="registerPassword">パスワード（8文字以上）</label>
                <input type="password" id="registerPassword" name="password" autocomplete="new-password" minlength="8" required>

                <label for="registerPasswordConfirm">パスワード（確認）</label>
                <input type="password" id="registerPasswordConfirm" name="passwordConfirm" autocomplete="new-password" required>

                <button type="submit" disabled>登録する</button>
            </form>

            <p id="registrationError" class="form-error" role="alert"></p>
            <p class="auth-switch"><a href="#login">ログインに戻る</a></p>
        </section>

        <noscript>ログインと新規登録にはJavaScriptを有効にしてください。</noscript>

    </main>

</body>
</html>
