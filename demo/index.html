<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>イキテル | デモ操作</title>
  <script src="demo.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: #F5F5F4; color: #1C1917; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 24px; background: #FFF; border: 1px solid #E7E5E4; border-radius: 16px; }
    h1 { margin: 0 0 12px; font-size: 1.375rem; }
    p { margin: 0 0 12px; }
    .demo-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 16px 0; }
    button { min-height: 48px; padding: 8px; border: 1px solid #D4D4D8; border-radius: 10px; background: #F5F5F4; color: inherit; font: inherit; cursor: pointer; }
    button:enabled:hover { background: #ECF7EF; border-color: #1E7A46; }
    button:disabled { color: #57534E; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 3px solid #2563EB; outline-offset: 2px; }
    a { color: #155E33; }
  </style>
</head>
<body>
  <main>
    <h1>イキテルのデモ操作</h1>
    <p id="connection-status" role="status">見守り画面を別タブで開いてログインしてください。</p>
    <p>デモの時刻：<span id="demo-clock">—</span></p>

    <div class="demo-buttons">
      <button id="demo-light" type="button" data-command="toggle-light" disabled>電気をつける</button>
      <button id="demo-relay" type="button" data-command="toggle-relay" disabled>中継器を抜く</button>
      <button type="button" data-command="advance-hour" disabled>1時間進める</button>
      <button type="button" data-command="advance-to-threshold" disabled>16時間経過</button>
    </div>

    <a href="../index.html" target="_blank" rel="noopener">見守り画面を開く</a>
  </main>
</body>
</html>
